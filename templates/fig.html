<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PAGE_TITLE__</title>
<style>
/*__THEME__*/
.fig-nav-wrap {
  position: sticky; top: var(--header-h); z-index: 30;
  padding: 10px 0 12px;
  background: linear-gradient(var(--paper) 72%, color-mix(in srgb, var(--paper) 0%, transparent));
}
.site-nav-wrap .fig-topnav { margin: 8px 0 0; max-width: none; }
.fig-section-head { margin-top: 16px; }
.fig-visual { top: calc(var(--header-h) + 116px); }
.overview-grid-title {
  font-family: var(--serif); font-size: 22px; font-weight: 600; margin: 34px 0 14px;
  display: flex; align-items: baseline; gap: 10px;
}
.overview-grid-title small { font-family: var(--sans); font-size: 12px; color: var(--faint); font-weight: 400; }
.logic-caption { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; }
.overview-note {
  margin-top: 18px; padding: 14px 16px;
  background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px;
  font-size: 13px; color: var(--ink-2); line-height: 1.75;
}
@media (max-width: 860px) {
  .fig-nav-wrap { position: static; }
}
@media print {
  .fig-nav-wrap { display: none; }
}
</style>
</head>
<body class="has-sidebar" data-page="fig">
<div class="progress" id="progress"></div>

<header class="app-header">
  <div class="header-inner">
  <button class="btn ghost mobile-toc-toggle" id="tocToggle" aria-label="目录">☰</button>
  <div class="brand">
    <div class="brand-mark">◧</div>
    <div class="brand-text">
      <div class="brand-kicker">Paper Reader · 图解</div>
      <div class="brand-title" id="topTitle">__PAPER_TITLE__</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn ghost" id="themeBtn" title="切换深色/浅色">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M2 12h2.4M19.6 12H22M4.8 19.2l1.7-1.7M17.5 6.5l1.7-1.7"/></svg>
    </button>
    <button class="btn" id="printBtn" title="打印 / 导出 PDF">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 9V3h10v6M7 18H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v7H7z"/></svg>
      <span class="label">打印</span>
    </button>
  </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-kicker">图目录 · Figures</div>
    <nav class="toc" id="figToc"></nav>
    <div class="side-block">
      <h3>读图提示</h3>
      <div class="side-hint">
        先读总览里的证据链，再逐图看面板。点击图片可全屏放大，<span class="kbd">←</span>/<span class="kbd">→</span> 切换 Figure。
      </div>
    </div>
    <div class="side-footer" id="sideMeta"></div>
  </aside>

  <main class="main">
    <div class="content-width">
      <div class="site-nav-wrap">
        <div class="site-nav" id="siteNav"></div>
        <div class="fig-topnav" id="figNav" role="tablist" aria-label="Figure 导航"></div>
      </div>
      <div id="overviewPane" class="fig-pane active" role="tabpanel"></div>
      <div id="figPanes"></div>
      <div class="footer">
        <div>图中标注与图例以原图为准；解读为作者观点的中文转述。</div>
        <div id="genStamp"></div>
      </div>
    </div>
  </main>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="关闭">×</button>
  <img id="lbImg" alt="">
  <div class="lb-cap" id="lbCap"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const DATA = __DATA__;
/*__NAV__*/
/*__SCRIPT__*/
</script>
</body>
</html>
