<style>
/*__THEME__*/
.method-toolbar {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  margin: 0 0 18px;
}
.method-toolbar .filter-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-right: 4px; }
.method-filter {
  border: 1px solid var(--line); background: var(--card); color: var(--muted);
  padding: 5px 11px; border-radius: 999px; font-size: 12px; cursor: pointer;
}
.method-filter:hover { color: var(--ink); border-color: var(--line-strong); }
.method-filter[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.method-card.is-hidden { display: none; }
.cite-box .cite-link { display: inline-flex; align-items: center; gap: 5px; }
@media print {
  .method-toolbar, .sidebar, .app-header { display: none; }
}
</style>
</head>

  </div>
