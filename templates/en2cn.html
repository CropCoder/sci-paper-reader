<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PAGE_TITLE__</title>
<style>
/*__THEME__*/
</style>
</head>
<body class="mode-compare has-sidebar" data-page="en2cn">
<div class="progress" id="progress"></div>

<header class="app-header">
  <div class="header-inner">
  <button class="btn ghost mobile-toc-toggle" id="tocToggle" aria-label="目录">☰</button>
  <div class="brand">
    <div class="brand-mark">¶</div>
    <div class="brand-text">
      <div class="brand-kicker">Paper Reader · 逐段精读</div>
      <div class="brand-title" id="topTitle">__PAPER_TITLE__</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn ghost" id="themeBtn" title="切换深色/浅色">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M2 12h2.4M19.6 12H22M4.8 19.2l1.7-1.7M17.5 6.5l1.7-1.7"/></svg>
    </button>
    <button class="btn" id="bookmarkFilterBtn" aria-pressed="false" title="只看书签">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-3.6L6 21V4.5Z"/></svg>
      <span class="label">书签</span> <span id="bkCount">0</span>
    </button>
    <button class="btn" id="printBtn" title="打印 / 导出 PDF">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 9V3h10v6M7 18H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v7H7z"/></svg>
      <span class="label">打印</span>
    </button>
  </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-search">
      <input id="searchInput" type="search" placeholder="搜索段落 / 关键词…  ( / )" autocomplete="off">
      <span class="search-icon">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      </span>
    </div>

    <div class="side-kicker">目录 · Contents</div>
    <nav class="toc" id="toc"></nav>

    <div class="side-block">
      <h3><span>书签 · Bookmarks</span><span id="bkCount2">0</span></h3>
      <div class="bookmark-list" id="bookmarkList">
        <div class="side-hint">点击段落右上角的书签图标，或按 <span class="kbd">B</span> 标记当前段落。</div>
      </div>
    </div>

    <div class="side-block">
      <h3>快捷键</h3>
      <div class="side-hint">
        <span class="kbd">J</span> 下一段 · <span class="kbd">K</span> 上一段<br>
        <span class="kbd">B</span> 书签 · <span class="kbd">/</span> 搜索<br>
        <span class="kbd">Esc</span> 清除搜索 / 关闭
      </div>
    </div>

    <div class="side-footer" id="sideMeta"></div>
  </aside>

  <main class="main">
    <div class="content-width">
      <div class="site-nav-wrap"><div class="site-nav" id="siteNav"></div></div>
      <section class="hero">
        <div class="hero-kicker">深度解读 · 逐段对照</div>
        <h1 id="paperTitle">__PAPER_TITLE__</h1>
        <p class="subtitle" id="paperSubtitle"></p>
        <div class="hero-meta" id="heroMeta"></div>
        <div class="hero-stats" id="heroStats"></div>
        <div class="one-liner" id="oneLiner"></div>
      </section>

      <div class="reader-toolbar">
        <div class="seg" id="modeSeg">
          <button data-mode="compare" aria-pressed="true">对照</button>
          <button data-mode="zh" aria-pressed="false">中文</button>
          <button data-mode="en" aria-pressed="false">English</button>
        </div>
        <div class="toolbar-spacer"></div>
        <div class="toolbar-count" id="paraCount"></div>
      </div>

      <div id="content"></div>

      <div class="footer">
        <div>本页由论文 PDF 自动抽取 + 人工逐段翻译生成；英文原文以 PDF 为准。</div>
        <div id="genStamp"></div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

const DATA = __DATA__;

/*__SCRIPT__*/
</script>
</body>
</html>
